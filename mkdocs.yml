site_name: Drone Vision — M4TD
site_description: Plataforma de inferência ao vivo e coleta de dataset a partir de drones DJI
copyright: Uso interno

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Início: index.md
  - Arquitetura:
      - Visão geral: arquitetura/index.md
      - Fluxo de informação: arquitetura/fluxo.md
      - Tecnologias: arquitetura/tecnologias.md
  - Rodar a aplicação:
      - Instalação: rodar/index.md
      - Modo teste: rodar/teste.md
      - Modo voo: rodar/voo.md
      - Serviço permanente: rodar/servico.md
  - A plataforma:
      - Tela Home: plataforma/home.md
      - Tela Datasets: plataforma/datasets.md
      - Tela Modelo: plataforma/modelo.md
  - Treinar o modelo:
      - Visão geral e Git Flow: treino/index.md
      - 1. Dataset: treino/01-dataset.md
      - 2. Rotulagem assistida: treino/02-rotulagem.md
      - 3. Treino: treino/03-treino.md
      - 4. Avaliação: treino/04-avaliacao.md
      - 5. Threshold: treino/05-threshold.md
      - 6. Publicar os pesos: treino/06-publicar.md
  - Operação:
      - Rede e acesso remoto: operacao/rede.md
      - Reduzir latência: operacao/latencia.md
      - Solução de problemas: operacao/troubleshooting.md
